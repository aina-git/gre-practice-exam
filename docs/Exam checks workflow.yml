name: Exam engine checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  exam-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/exam-engine.test.cjs
      - run: node --check desktop/main.js
