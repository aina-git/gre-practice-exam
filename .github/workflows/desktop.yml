# Builds the GRE Ready desktop app for Mac and Windows.
#
# Run it by hand from the Actions tab (the installers appear as downloadable
# artifacts), or push a tag like `desktop-v3.0.0` to also publish them as a
# GitHub Release with install instructions.
name: Desktop app

on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,   name: macOS,   script: 'build:mac' }
          - { os: windows-latest, name: Windows, script: 'build:win' }
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build installers
        run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # unsigned build; no certificate in this repo
      - name: List
        run: ls -la dist
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: GRE-Ready-${{ matrix.name }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.exe
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: GRE Ready desktop ${{ github.ref_name }}
          files: dist/*
          body: |
            ## GRE Ready — desktop app

            **Mac:** download the `.dmg` for your chip — `mac-arm64` for Apple Silicon (M1/M2/M3/M4), `mac-x64` for Intel — open it and drag **GRE Ready** into **Applications**.
            The app is not signed with an Apple developer certificate, so the first launch is blocked with "cannot be opened". Open **System Settings → Privacy & Security**, scroll down, and click **Open Anyway** (older macOS: right-click the app → **Open**). This is needed once.

            **Windows:** run `GRE-Ready-…-windows-setup.exe` (installer) or `…-windows-portable.exe` (no install). Windows SmartScreen may warn because the app is unsigned — click **More info → Run anyway**.

            Works fully offline. AI features use the key you add in Settings (Gemini and Groq have free keys; OpenAI, Anthropic and local models work too). Your scores stay on this computer; use Settings → Backup to move them.
