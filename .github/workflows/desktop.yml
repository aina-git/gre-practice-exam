# Builds the GRE Ready desktop app for Mac and Windows.
#
# Run it by hand from the Actions tab (the installers appear as downloadable
# artifacts), or publish a GitHub Release with install instructions by pushing
# a tag like `desktop-v3.0.0` — or, where tags cannot be pushed, a branch named
# `desktop-release/v3.0.0` (the release job derives the tag from the branch).
name: Desktop app

on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']
    branches: ['desktop-release/**']

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    # Deleting a release branch or tag also arrives as a push, carrying the
    # default branch's commit instead of the deleted one. Never build (and so
    # never publish) from a deletion.
    if: ${{ !github.event.deleted }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,   name: macOS,   script: 'build:mac' }
          - { os: windows-latest, name: Windows, script: 'build:win' }
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build installers
        run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # unsigned build; no certificate in this repo
      - name: List
        run: ls -la dist
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: GRE-Ready-${{ matrix.name }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.exe
          if-no-files-found: error

  release:
    name: Publish release
    if: ${{ !github.event.deleted && (startsWith(github.ref, 'refs/tags/desktop-v') || startsWith(github.ref, 'refs/heads/desktop-release/')) }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release tag
        id: tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_API: ${{ github.api_url }}/repos/${{ github.repository }}/git/ref/tags
        run: |
          ref="${{ github.ref_name }}"
          case "$ref" in
            desktop-release/*)
              tag="desktop-${ref#desktop-release/}"
              # A release tag is immutable. A second push to the same release
              # branch would rebuild the installers from a new commit while the
              # tag still pointed at the first one, so it is refused: bump the
              # version in desktop/package.json and push a new release branch.
              # Only a definite "no such tag" (HTTP 404) lets the release go
              # ahead; an existing tag (200) or any failure to find out (auth,
              # rate limit, network) stops it, so a published release is never
              # overwritten by accident.
              code=$(curl -sS --retry 3 -o /dev/null -w '%{http_code}' \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "$TAG_API/$tag" || true)
              case "$code" in
                404) ;;
                200)
                  echo "::error::Tag $tag already exists — a release was already published for this version. Bump desktop/package.json and push desktop-release/v<new-version>."
                  exit 1 ;;
                *)
                  echo "::error::Could not check whether tag $tag exists (HTTP status '$code'); not publishing."
                  exit 1 ;;
              esac ;;
            *) tag="$ref" ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: GRE Ready desktop ${{ steps.tag.outputs.tag }}
          files: dist/*
          body: |
            ## GRE Ready — desktop app

            **Mac:** download the `.dmg` for your chip — `mac-arm64` for Apple Silicon (M1/M2/M3/M4), `mac-x64` for Intel — open it and drag **GRE Ready** into **Applications**.
            The app is not signed with an Apple developer certificate, so the first launch is blocked with "cannot be opened". Open **System Settings → Privacy & Security**, scroll down, and click **Open Anyway** (older macOS: right-click the app → **Open**). This is needed once.

            **Windows:** run `GRE-Ready-…-windows-setup.exe` (installer) or `…-windows-portable.exe` (no install). Windows SmartScreen may warn because the app is unsigned — click **More info → Run anyway**.

            Works fully offline. AI features use the key you add in Settings (Gemini and Groq have free keys; OpenAI, Anthropic and local models work too). Your scores stay on this computer; use Settings → Backup to move them.
